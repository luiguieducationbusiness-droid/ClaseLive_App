<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Fondo principal -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Gradiente de la burbuja -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" /> <!-- Índigo -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Azul -->
    </linearGradient>
    
    <!-- Sombra para dar profundidad -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    
    <!-- Brillo para el indicador LIVE -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo 1:1 con bordes suaves -->
  <rect width="500" height="500" rx="110" fill="url(#bg)" />

  <!-- Grupo central del isotipo -->
  <g transform="translate(0, -20)">
    
    <!-- Burbuja de comunicación -->
    <path d="M 125 120 h 250 a 40 40 0 0 1 40 40 v 100 a 40 40 0 0 1 -40 40 h -80 l -30 35 v -35 h -140 a 40 40 0 0 1 -40 -40 v -100 a 40 40 0 0 1 40 -40 z" 
          fill="url(#bubbleGrad)" filter="url(#shadow)"/>
    
    <!-- Indicador rojo de grabación LIVE -->
    <circle cx="395" cy="100" r="14" fill="#ef4444" filter="url(#glow)">
       <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Transformación: De Audio a Texto -->
    <!-- Ondas de Audio -->
    <g fill="#ffffff">
      <rect x="125" y="180" width="12" height="40" rx="6">
         <animate attributeName="height" values="40;20;40" dur="1s" repeatCount="indefinite" />
         <animate attributeName="y" values="180;190;180" dur="1s" repeatCount="indefinite" />
      </rect>
      <rect x="150" y="160" width="12" height="80" rx="6">
         <animate attributeName="height" values="80;40;80" dur="1.2s" repeatCount="indefinite" />
         <animate attributeName="y" values="160;180;160" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="175" y="170" width="12" height="60" rx="6">
         <animate attributeName="height" values="60;30;60" dur="0.8s" repeatCount="indefinite" />
         <animate attributeName="y" values="170;185;170" dur="0.8s" repeatCount="indefinite" />
      </rect>
      <rect x="200" y="185" width="12" height="30" rx="6">
         <animate attributeName="height" values="30;15;30" dur="1.5s" repeatCount="indefinite" />
         <animate attributeName="y" values="185;192.5;185" dur="1.5s" repeatCount="indefinite" />
      </rect>
    </g>
    
    <!-- Separador sutil -->
    <line x1="235" y1="150" x2="235" y2="250" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="5,5" />
    
    <!-- Líneas de texto (transcripción) -->
    <g fill="#ffffff">
      <rect x="260" y="165" width="110" height="12" rx="6" />
      <rect x="260" y="195" width="85" height="12" rx="6" />
      <rect x="260" y="225" width="100" height="12" rx="6" />
    </g>
  </g>
  
  <!-- Texto de la Marca -->
  <text x="250" y="380" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    CLASE <tspan fill="#ef4444">LIVE</tspan>
  </text>
  <text x="250" y="420" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="4">
    TRANSCRIPCIÓN DE CLASES
  </text>
</svg>
